name: BIGGER OTG v4 - GERAR APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restaurar projeto v4
        run: |
          mkdir -p buildsrc
          cat v4chunks/chunk_*.txt > bigger-otg-v4.b64
          test "$(wc -c < bigger-otg-v4.b64)" -eq 20064
          base64 -d bigger-otg-v4.b64 > bigger-otg-v4.zip
          unzip -t bigger-otg-v4.zip
          unzip -q bigger-otg-v4.zip -d buildsrc

      - name: Configurar Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug --stacktrace

      - name: Validar e preparar APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p output
          cp buildsrc/app/build/outputs/apk/debug/app-debug.apk output/BIGGER-OTG-v4.apk
          unzip -t output/BIGGER-OTG-v4.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs output/BIGGER-OTG-v4.apk
          ls -lh output/BIGGER-OTG-v4.apk
          sha256sum output/BIGGER-OTG-v4.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BIGGER-OTG-v4-APK
          path: output/BIGGER-OTG-v4.apk
