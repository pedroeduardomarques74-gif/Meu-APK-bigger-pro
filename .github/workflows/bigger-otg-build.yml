name: BIGGER OTG v6.5 - GERAR APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restaurar base v3
        run: |
          mkdir -p buildsrc
          cat v3chunks/chunk_*.txt > bigger-otg-v3.b64
          test "$(wc -c < bigger-otg-v3.b64)" -eq 18948
          base64 -d bigger-otg-v3.b64 > bigger-otg-v3.zip
          unzip -t bigger-otg-v3.zip
          unzip -q bigger-otg-v3.zip -d buildsrc

      - name: Aplicar recursos v4
        run: python3 v5/patch_v4.py

      - name: Aplicar recursos v5
        run: python3 v5/patch_v5.py

      - name: Aplicar correção v5.1
        run: python3 v5/patch_v51.py

      - name: Aplicar correção v5.2
        run: python3 v5/patch_v52.py

      - name: Aplicar correção global v6
        run: python3 v6/patch_layout_v6.py

      - name: Aplicar melhorias v6.1
        run: python3 v6/patch_v61.py

      - name: Aplicar melhorias v6.2
        run: python3 v6/patch_v62.py

      - name: Aplicar melhorias v6.3
        run: python3 v6/patch_v63.py

      - name: Aplicar correção v6.4
        run: python3 v6/patch_v64.py

      - name: Aplicar correção v6.5
        run: python3 v6/patch_v65.py

      - name: Configurar Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug --stacktrace

      - name: Validar e preparar APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p output
          cp buildsrc/app/build/outputs/apk/debug/app-debug.apk output/BIGGER-OTG-v6.5.apk
          unzip -t output/BIGGER-OTG-v6.5.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs output/BIGGER-OTG-v6.5.apk
          ls -lh output/BIGGER-OTG-v6.5.apk
          sha256sum output/BIGGER-OTG-v6.5.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BIGGER-OTG-v6.5-APK
          path: output/BIGGER-OTG-v6.5.apk
