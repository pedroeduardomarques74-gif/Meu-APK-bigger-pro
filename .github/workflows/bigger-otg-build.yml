name: BIGGER OTG v1 - GERAR APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Restaurar projeto
        run: |
          mkdir -p buildsrc
          base64 -d bigger-otg-project.b64 > bigger-otg-project.zip
          unzip -q bigger-otg-project.zip -d buildsrc

      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p output
          cp buildsrc/app/build/outputs/apk/debug/app-debug.apk output/BIGGER-OTG-v1.apk
          ls -lh output/BIGGER-OTG-v1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BIGGER-OTG-v1-APK
          path: output/BIGGER-OTG-v1.apk
