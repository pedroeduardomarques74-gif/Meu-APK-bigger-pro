name: BIGGER OTG v7.3 - AUDITORIA E BUILD
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restaurar base v3
        run: |
          mkdir -p buildsrc
          cat v3chunks/chunk_*.txt > bigger-otg-v3.b64
          test "$(wc -c < bigger-otg-v3.b64)" -eq 18948
          base64 -d bigger-otg-v3.b64 > bigger-otg-v3.zip
          unzip -t bigger-otg-v3.zip
          unzip -q bigger-otg-v3.zip -d buildsrc

      - name: Aplicar recursos v4
        run: python3 v5/patch_v4.py

      - name: Aplicar recursos v5
        run: python3 v5/patch_v5.py

      - name: Aplicar correção v5.1
        run: python3 v5/patch_v51.py

      - name: Aplicar correção v5.2
        run: python3 v5/patch_v52.py

      - name: Aplicar correção global v6
        run: python3 v6/patch_layout_v6.py

      - name: Aplicar melhorias v6.1
        run: python3 v6/patch_v61.py

      - name: Aplicar melhorias v6.2
        run: python3 v6/patch_v62.py

      - name: Aplicar melhorias v6.3
        run: python3 v6/patch_v63.py

      - name: Aplicar correção v6.4
        run: python3 v6/patch_v64.py

      - name: Aplicar correção v6.5
        run: python3 v6/patch_v65.py

      - name: Aplicar correção v6.6
        run: python3 v6/patch_v66.py

      - name: Aplicar hardening principal v7
        run: python3 v7/patch_core_v7.py

      - name: Aplicar hardening APK v7
        run: python3 v7/patch_apps_v7.py

      - name: Aplicar hardening compartilhamento v7
        run: python3 v7/patch_share_v7.py

      - name: Aplicar compatibilidade v7
        run: python3 v7/patch_compat_v7.py

      - name: Corrigir lint v7
        run: python3 v7/patch_lint_v7.py

      - name: Eliminar catches vazios v7
        run: python3 v7/patch_no_empty_catches_v7.py

      - name: Aplicar fechamento final v7.1
        run: python3 v7/patch_final_v71.py

      - name: Aplicar recursos v7.2
        run: python3 v7/patch_v72.py

      - name: Aplicar correção de scroll v7.3
        run: python3 v7/patch_v73_scroll.py

      - name: Configurar Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android Lint
        working-directory: buildsrc
        run: |
          set +e
          gradle :app:lintDebug --stacktrace
          code=$?
          echo "===== RELATORIO LINT COMPLETO ====="
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
          exit $code

      - name: Compilar APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug --stacktrace

      - name: Validar e preparar APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          mkdir -p output
          cp buildsrc/app/build/outputs/apk/debug/app-debug.apk output/BIGGER-OTG-v7.3.apk
          unzip -t output/BIGGER-OTG-v7.3.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs output/BIGGER-OTG-v7.3.apk
          ls -lh output/BIGGER-OTG-v7.3.apk
          sha256sum output/BIGGER-OTG-v7.3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BIGGER-OTG-v7.3-APK
          path: output/BIGGER-OTG-v7.3.apk
